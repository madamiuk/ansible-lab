---
- name: Sprawdzenie tabeli PostgreSQL
  hosts: database
  gather_facts: false

  tasks:
    - name: Pobierz strukturę tabeli
      community.postgresql.postgresql_query:
        login_host: 127.0.0.1
        login_user: "{{ postgresql_db_user }}"
        login_password: "{{ postgresql_db_password }}"
        login_db: "{{ postgresql_db_name }}"
        query: |
          SELECT
            column_name,
            data_type
          FROM information_schema.columns
          WHERE table_schema = 'public'
            AND table_name = '{{ postgresql_table }}'
          ORDER BY ordinal_position;
      register: table_info
      no_log: true

    - name: Pokaż strukturę tabeli
      ansible.builtin.debug:
        var: table_info.query_result
