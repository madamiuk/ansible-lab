---
- name: Test zdalnego połączenia z PostgreSQL
  hosts: db_clients
  gather_facts: true
  become: true

  vars:
    postgresql_test_database_host: database02

    postgresql_client_package_map:
      Debian: postgresql-client
      OracleLinux: postgresql
      RedHat: postgresql

  tasks:
    - name: Sprawdź czy host bazy istnieje w inventory
      ansible.builtin.assert:
        that:
          - postgresql_test_database_host in hostvars
        fail_msg: >-
          Host bazy '{{ postgresql_test_database_host }}'
          nie istnieje w inventory.
      run_once: true

    - name: Ustal adres serwera PostgreSQL
      ansible.builtin.set_fact:
        postgresql_test_database_address: >-
          {{
            hostvars[postgresql_test_database_host]['ansible_host']
            | default(postgresql_test_database_host)
          }}

    - name: Zainstaluj klienta PostgreSQL
      ansible.builtin.package:
        name: "{{ postgresql_client_package_map[ansible_facts['distribution']] }}"
        state: present

    - name: Sprawdź zdalne połączenie z PostgreSQL
      ansible.builtin.command:
        argv:
          - psql
          - -h
          - "{{ postgresql_test_database_address }}"
          - -U
          - "{{ postgresql_db_user }}"
          - -d
          - "{{ postgresql_db_name }}"
          - -c
          - "SELECT current_user, current_database();"
      environment:
        PGPASSWORD: "{{ postgresql_db_password }}"
      register: psql_result
      changed_when: false
      no_log: true

    - name: Pokaż wynik połączenia
      ansible.builtin.debug:
        var: psql_result.stdout
