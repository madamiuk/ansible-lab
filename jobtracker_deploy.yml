---
- name: Build and deploy JobTracker
  hosts: appservers
  become: true
  gather_facts: true

  vars:
    jobtracker_project_dir: /Users/ma/jobtracker
    jobtracker_build_local: true

    wildfly_app_name: jobtracker
    wildfly_war_source: "{{ jobtracker_project_dir }}/target/jobtracker.war"

    wildfly_required_war_entries:
      - WEB-INF/
      - WEB-INF/classes/META-INF/persistence.xml
      - WEB-INF/classes/pl/jobtracker/config/RestApplication.class
      - WEB-INF/classes/pl/jobtracker/rest/HealthResource.class

    wildfly_build_info_required: false

  pre_tasks:
    - name: Build JobTracker WAR locally
      ansible.builtin.command:
        argv:
          - mvn
          - clean
          - package
      args:
        chdir: "{{ jobtracker_project_dir }}"
      environment:
        JAVA_HOME: /opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
        PATH: "/opt/homebrew/opt/openjdk@21/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true
      when: jobtracker_build_local | bool

  tasks:
    - name: JobTracker deployment preflight
      ansible.builtin.include_role:
        name: wildfly
        tasks_from: preflight.yml

    - name: Deploy JobTracker WAR
      ansible.builtin.include_role:
        name: wildfly
        tasks_from: deploy.yml

  post_tasks:
    - name: Verify JobTracker health endpoint
      ansible.builtin.uri:
        url: "http://{{ wildfly_bind_address }}:8080/jobtracker/api/health"
        method: GET
        return_content: true
        status_code: 200
      register: jobtracker_health
      changed_when: false

    - name: Confirm JobTracker application health
      ansible.builtin.assert:
        that:
          - jobtracker_health.status == 200
          - '"JobTracker" in jobtracker_health.content'
          - '"UP" in jobtracker_health.content'
        success_msg: "JobTracker został poprawnie wdrożony i działa."
        fail_msg: "JobTracker został wdrożony, ale test health endpoint nie przeszedł."

    - name: Smoke test JobTracker companies endpoint
      ansible.builtin.uri:
        url: "http://{{ wildfly_bind_address }}:8080/jobtracker/api/companies"
        method: GET
        return_content: true
        status_code: 200
      register: jobtracker_companies
      changed_when: false

    - name: Smoke test JobTracker offers endpoint
      ansible.builtin.uri:
        url: "http://{{ wildfly_bind_address }}:8080/jobtracker/api/offers"
        method: GET
        return_content: true
        status_code: 200
      register: jobtracker_offers
      changed_when: false

    - name: Smoke test JobTracker applications endpoint
      ansible.builtin.uri:
        url: "http://{{ wildfly_bind_address }}:8080/jobtracker/api/applications"
        method: GET
        return_content: true
        status_code: 200
      register: jobtracker_applications
      changed_when: false

    - name: Confirm JobTracker REST smoke tests
      ansible.builtin.assert:
        that:
          - jobtracker_companies.status == 200
          - jobtracker_offers.status == 200
          - jobtracker_applications.status == 200

          - "'application/json' in jobtracker_companies.content_type"
          - "'application/json' in jobtracker_offers.content_type"
          - "'application/json' in jobtracker_applications.content_type"

          - jobtracker_companies.json is defined
          - jobtracker_offers.json is defined
          - jobtracker_applications.json is defined

          - jobtracker_companies.json | type_debug == 'list'
          - jobtracker_offers.json | type_debug == 'list'
          - jobtracker_applications.json | type_debug == 'list'

        success_msg: >-
          JobTracker REST smoke tests przeszły poprawnie:
          HTTP 200, application/json oraz poprawne listy JSON.
        fail_msg: >-
          Co najmniej jeden endpoint JobTracker REST
          nie zwrócił oczekiwanej odpowiedzi JSON.

    - name: Validate JobTracker REST response structure
      ansible.builtin.assert:
        that:
          - >-
            (jobtracker_companies.json | length == 0)
            or
            (
              'id' in jobtracker_companies.json[0]
              and 'name' in jobtracker_companies.json[0]
            )

          - >-
            (jobtracker_offers.json | length == 0)
            or
            (
              'id' in jobtracker_offers.json[0]
              and 'companyName' in jobtracker_offers.json[0]
              and 'positionTitle' in jobtracker_offers.json[0]
            )

          - >-
            (jobtracker_applications.json | length == 0)
            or
            (
              'id' in jobtracker_applications.json[0]
              and 'companyName' in jobtracker_applications.json[0]
              and 'positionTitle' in jobtracker_applications.json[0]
              and 'currentStatus' in jobtracker_applications.json[0]
            )

        success_msg: >-
          JobTracker REST response structure jest zgodna z oczekiwanym kontraktem.
        fail_msg: >-
          Co najmniej jeden endpoint JobTracker zwrócił JSON
          o nieoczekiwanej strukturze.
