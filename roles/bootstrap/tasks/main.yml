---
- name: Sprawdź wymagane zmienne bootstrap
  ansible.builtin.assert:
    that:
      - bootstrap_ipv4_address is defined
      - bootstrap_ipv4_prefix is defined
      - bootstrap_ipv4_gateway is defined
      - bootstrap_dns_servers | length > 0

- name: Bootstrap Debian
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Bootstrap RedHat
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'
