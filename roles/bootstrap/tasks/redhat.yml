---
- name: Pobierz aktualną konfigurację profilu NetworkManager
  ansible.builtin.command:
    argv:
      - nmcli
      - -g
      - ipv4.method,ipv4.addresses,ipv4.gateway,ipv4.dns,ipv4.ignore-auto-dns,ipv6.method
      - connection
      - show
      - "{{ bootstrap_nm_connection }}"
  register: bootstrap_nm_current
  changed_when: false
  check_mode: false

- name: Zbuduj oczekiwaną konfigurację NetworkManager
  ansible.builtin.set_fact:
    bootstrap_nm_expected:
      - manual
      - "{{ bootstrap_ipv4_address }}/{{ bootstrap_ipv4_prefix }}"
      - "{{ bootstrap_ipv4_gateway }}"
      - "{{ bootstrap_dns_servers | join(',') }}"
      - "yes"
      - "{{ 'disabled' if bootstrap_disable_ipv6 else 'auto' }}"

- name: Pokaż planowaną zmianę profilu NetworkManager
  ansible.builtin.debug:
    msg: >-
      Profil {{ bootstrap_nm_connection }} wymaga zmiany:
      {{ bootstrap_nm_current.stdout_lines }}
      ->
      {{ bootstrap_nm_expected }}
  when:
    - ansible_check_mode
    - bootstrap_nm_current.stdout_lines != bootstrap_nm_expected
  changed_when: true

- name: Skonfiguruj profil NetworkManager
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ bootstrap_nm_connection }}"
      - ipv4.method
      - manual
      - ipv4.addresses
      - "{{ bootstrap_ipv4_address }}/{{ bootstrap_ipv4_prefix }}"
      - ipv4.gateway
      - "{{ bootstrap_ipv4_gateway }}"
      - ipv4.dns
      - "{{ bootstrap_dns_servers | join(',') }}"
      - ipv4.ignore-auto-dns
      - "yes"
      - ipv6.method
      - "{{ 'disabled' if bootstrap_disable_ipv6 else 'auto' }}"
  when:
    - not ansible_check_mode
    - bootstrap_nm_current.stdout_lines != bootstrap_nm_expected
  notify: Bootstrap configuration changed

- name: Skonfiguruj sysctl dla IPv6
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-disable-ipv6.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.lo.disable_ipv6 = 1
  when: bootstrap_disable_ipv6
  notify: Bootstrap configuration changed
