---
wildfly_version: 41.0.1.Final

wildfly_archive: "wildfly-{{ wildfly_version }}.tar.gz"
wildfly_download_url: "https://github.com/wildfly/wildfly/releases/download/{{ wildfly_version }}/{{ wildfly_archive }}"

wildfly_sha256: "26e27908f5c720d53f24abb95f9575d04f580510e5d85fad513cda9ade8119c3"

wildfly_install_parent: /opt
wildfly_version_dir: "{{ wildfly_install_parent }}/wildfly-{{ wildfly_version }}"
wildfly_home: "{{ wildfly_install_parent }}/wildfly"

wildfly_archive_path: "/tmp/{{ wildfly_archive }}"

wildfly_user: wildfly
wildfly_group: wildfly

wildfly_service: wildfly
wildfly_java_home_map:
  Debian: /usr/lib/jvm/java-21-openjdk-arm64
  RedHat: /usr/lib/jvm/java-21-openjdk

wildfly_java_home: "{{ wildfly_java_home_map[ansible_facts['os_family']] }}"

wildfly_bind_address: 127.0.0.1
wildfly_management_bind_address: 127.0.0.1

wildfly_deployments_dir: "{{ wildfly_home }}/standalone/deployments"
wildfly_app_name: hello-wildfly
wildfly_war_source: "{{ playbook_dir }}/applications/hello-wildfly/target/hello-wildfly.war"

wildfly_postgresql_jdbc_package_map:
  Debian: libpostgresql-jdbc-java
  RedHat: postgresql-jdbc

wildfly_postgresql_jdbc_package: "{{ wildfly_postgresql_jdbc_package_map[ansible_facts['os_family']] }}"

wildfly_postgresql_jdbc_jar: /usr/share/java/postgresql.jar

wildfly_postgresql_module_name: org.postgresql.jdbc
wildfly_postgresql_module_dir: "{{ wildfly_home }}/modules/org/postgresql/jdbc/main"

wildfly_postgresql_driver_name: postgresql
wildfly_postgresql_driver_module: org.postgresql.jdbc
wildfly_postgresql_driver_class: org.postgresql.Driver
wildfly_postgresql_driver_xa_class: org.postgresql.xa.PGXADataSource

wildfly_datasource_name: AnsibleLabDS
