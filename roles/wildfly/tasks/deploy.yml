---
- name: Sprawdź aktualny marker .deployed
  ansible.builtin.stat:
    path: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.deployed"
  register: wildfly_deployed_before
  when: not ansible_check_mode
  tags:
    - deploy

- name: Sprawdź aktualny marker .failed
  ansible.builtin.stat:
    path: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.failed"
  register: wildfly_failed_before
  when: not ansible_check_mode
  tags:
    - deploy

- name: Wdróż aplikację hello-wildfly
  ansible.builtin.copy:
    src: "{{ wildfly_war_source }}"
    dest: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war"
    owner: "{{ wildfly_user }}"
    group: "{{ wildfly_group }}"
    mode: '0644'
    backup: true
  register: wildfly_war_deploy
  when: not ansible_check_mode
  tags:
    - deploy

- name: Oblicz SHA-256 WAR po stronie hosta WildFly
  ansible.builtin.stat:
    path: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war"
    checksum_algorithm: sha256
    get_checksum: true
  register: wildfly_remote_war
  when: not ansible_check_mode
  tags:
    - deploy

- name: Potwierdź zgodność wdrożonego WAR z artefaktem
  ansible.builtin.assert:
    that:
      - wildfly_remote_war.stat.exists
      - wildfly_remote_war.stat.checksum == wildfly_war_artifact.stat.checksum
    fail_msg: >-
      SHA-256 WAR na hoście {{ inventory_hostname }}
      nie zgadza się z artefaktem źródłowym.
    success_msg: >-
      SHA-256 WAR na hoście {{ inventory_hostname }}:
      {{ wildfly_remote_war.stat.checksum }}
  when: not ansible_check_mode
  tags:
    - deploy

- name: Poczekaj na wynik wdrożenia aplikacji
  when:
    - not ansible_check_mode
    - wildfly_war_deploy is changed
  block:
    - name: Czekaj na zmianę markera deploymentu
      ansible.builtin.shell: |
        DEPLOYED="{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.deployed"
        FAILED="{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.failed"

        if [ -f "$FAILED" ]; then
          FAILED_MTIME="$(stat -c %Y "$FAILED")"

          if [ "{{ wildfly_failed_before.stat.exists | default(false) }}" = "False" ] || \
             [ "$FAILED_MTIME" != "{{ wildfly_failed_before.stat.mtime | default(0) | int }}" ]; then
            exit 2
          fi
        fi

        if [ -f "$DEPLOYED" ]; then
          DEPLOYED_MTIME="$(stat -c %Y "$DEPLOYED")"

          if [ "{{ wildfly_deployed_before.stat.exists | default(false) }}" = "False" ] || \
             [ "$DEPLOYED_MTIME" != "{{ wildfly_deployed_before.stat.mtime | default(0) | int }}" ]; then
            exit 0
          fi
        fi

        exit 1
      args:
        executable: /bin/bash
      register: wildfly_deploy_result
      changed_when: false
      failed_when: false
      until: wildfly_deploy_result.rc in [0, 2]
      retries: 12
      delay: 5

    - name: Odczytaj szczegóły błędu deploymentu
      ansible.builtin.slurp:
        src: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.failed"
      register: wildfly_failed_details
      when: wildfly_deploy_result.rc == 2

    - name: Przywróć poprzednią wersję WAR po błędzie deploymentu
      ansible.builtin.copy:
        src: "{{ wildfly_war_deploy.backup_file }}"
        dest: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war"
        remote_src: true
        owner: "{{ wildfly_user }}"
        group: "{{ wildfly_group }}"
        mode: '0644'
      when:
        - wildfly_deploy_result.rc == 2
        - wildfly_war_deploy.backup_file is defined
      register: wildfly_rollback_restore

    - name: Usuń marker nieudanego deploymentu przed rollbackiem
      ansible.builtin.file:
        path: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.failed"
        state: absent
      when:
        - wildfly_deploy_result.rc == 2
        - wildfly_war_deploy.backup_file is defined

    - name: Wymuś deployment przywróconej wersji
      ansible.builtin.file:
        path: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.dodeploy"
        state: touch
        owner: "{{ wildfly_user }}"
        group: "{{ wildfly_group }}"
        mode: '0644'
      when:
        - wildfly_deploy_result.rc == 2
        - wildfly_war_deploy.backup_file is defined

    - name: Poczekaj na poprawny deployment po rollbacku
      ansible.builtin.wait_for:
        path: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.deployed"
        state: present
        timeout: 60
      when:
        - wildfly_deploy_result.rc == 2
        - wildfly_war_deploy.backup_file is defined

    - name: Sprawdź marker błędu po rollbacku
      ansible.builtin.stat:
        path: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.failed"
      register: wildfly_rollback_failed_marker
      when:
        - wildfly_deploy_result.rc == 2
        - wildfly_war_deploy.backup_file is defined

    - name: Potwierdź poprawny rollback
      ansible.builtin.assert:
        that:
          - not wildfly_rollback_failed_marker.stat.exists
        success_msg: >-
          Rollback aplikacji {{ wildfly_app_name }} zakończył się powodzeniem.
        fail_msg: >-
          Rollback aplikacji {{ wildfly_app_name }} również zakończył się błędem.
      when:
        - wildfly_deploy_result.rc == 2
        - wildfly_war_deploy.backup_file is defined

    - name: Zatrzymaj playbook po wykonaniu rollbacku
      ansible.builtin.fail:
        msg: >-
          Deployment {{ wildfly_app_name }} zakończył się błędem.
          Poprzednia wersja aplikacji została przywrócona.
          Błąd deploymentu:
          {{
            wildfly_failed_details.content
            | b64decode
            | trim
          }}
      when:
        - wildfly_deploy_result.rc == 2
        - wildfly_war_deploy.backup_file is defined

    - name: Zatrzymaj playbook przy błędzie bez dostępnego backupu
      ansible.builtin.fail:
        msg: >-
          Deployment {{ wildfly_app_name }} zakończył się błędem,
          a poprzednia wersja WAR nie jest dostępna do rollbacku.
          Błąd deploymentu:
          {{
            wildfly_failed_details.content
            | b64decode
            | trim
          }}
      when:
        - wildfly_deploy_result.rc == 2
        - wildfly_war_deploy.backup_file is not defined

    - name: Potwierdź poprawne wdrożenie aplikacji
      ansible.builtin.assert:
        that:
          - wildfly_deploy_result.rc == 0
        fail_msg: >-
          WildFly nie potwierdził nowego deploymentu
          {{ wildfly_app_name }} w ciągu 60 sekund.
        success_msg: >-
          Aplikacja {{ wildfly_app_name }} została poprawnie wdrożona.

    - name: Znajdź backupy WAR
      ansible.builtin.find:
        paths: "{{ wildfly_deployments_dir }}"
        patterns: "{{ wildfly_app_name }}.war.*~"
        file_type: file
        recurse: false
      register: wildfly_war_backups

    - name: Usuń starsze backupy WAR
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: >-
        {{
          (
            wildfly_war_backups.files
            | sort(attribute='mtime', reverse=true)
          )[5:]
        }}
      loop_control:
        label: "{{ item.path | basename }}"

  tags:
    - deploy

- name: Zapisz SHA-256 poprawnie wdrożonego WAR
  ansible.builtin.copy:
    content: "{{ wildfly_remote_war.stat.checksum }}  {{ wildfly_app_name }}.war\n"
    dest: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.sha256"
    owner: "{{ wildfly_user }}"
    group: "{{ wildfly_group }}"
    mode: '0644'
  when: not ansible_check_mode
  tags:
    - deploy
