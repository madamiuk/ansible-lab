---
- name: Sprawdź status usługi WildFly
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - wildfly.service
  register: wildfly_service_status
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  tags:
    - verify

- name: Potwierdź działanie usługi WildFly
  ansible.builtin.assert:
    that:
      - wildfly_service_status.rc == 0
      - wildfly_service_status.stdout == "active"
    fail_msg: "Usługa WildFly nie działa poprawnie."
    success_msg: "Usługa WildFly działa poprawnie."
  when: not ansible_check_mode
  tags:
    - verify

- name: Sprawdź obecność pliku WAR
  ansible.builtin.stat:
    path: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war"
  register: wildfly_war_file
  when: not ansible_check_mode
  tags:
    - verify

- name: Potwierdź obecność pliku WAR
  ansible.builtin.assert:
    that:
      - wildfly_war_file.stat.exists
      - wildfly_war_file.stat.isreg
    fail_msg: "Brak pliku {{ wildfly_app_name }}.war w katalogu deployments."
    success_msg: "Plik {{ wildfly_app_name }}.war znajduje się w katalogu deployments."
  when: not ansible_check_mode
  tags:
    - verify

- name: Sprawdź marker poprawnego deploymentu
  ansible.builtin.stat:
    path: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.deployed"
  register: wildfly_deployed_marker
  when: not ansible_check_mode
  tags:
    - verify

- name: Potwierdź poprawny deployment aplikacji
  ansible.builtin.assert:
    that:
      - wildfly_deployed_marker.stat.exists
    fail_msg: "WildFly nie utworzył markera {{ wildfly_app_name }}.war.deployed."
    success_msg: "Aplikacja {{ wildfly_app_name }} została poprawnie wdrożona."
  when: not ansible_check_mode
  tags:
    - verify

- name: Zweryfikuj datasource PostgreSQL
  when: not ansible_check_mode
  block:
    - name: Testuj połączenie datasource PostgreSQL
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ wildfly_user }}"
          - --
          - "{{ wildfly_home }}/bin/jboss-cli.sh"
          - --connect
          - "--command=/subsystem=datasources/data-source={{ wildfly_datasource_name }}:test-connection-in-pool"
      register: datasource_test
      changed_when: false

    - name: Potwierdź poprawne działanie datasource PostgreSQL
      ansible.builtin.assert:
        that:
          - '"\"outcome\" => \"success\"" in datasource_test.stdout'
          - '"\"result\" => [true]" in datasource_test.stdout'
        success_msg: "Datasource {{ wildfly_datasource_name }} działa poprawnie."

  rescue:
    - name: Wyświetl błąd datasource
      ansible.builtin.debug:
        msg: "Datasource {{ wildfly_datasource_name }} nie działa poprawnie."

    - name: Zatrzymaj wykonanie playbooka
      ansible.builtin.fail:
        msg: "Weryfikacja datasource {{ wildfly_datasource_name }} zakończyła się błędem."

  always:
    - name: Zakończono weryfikację datasource
      ansible.builtin.debug:
        msg: "Test datasource {{ wildfly_datasource_name }} został wykonany."

  tags:
    - datasource
    - verify

- name: Sprawdź endpoint aplikacji WildFly
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/hello-wildfly/api/hello/data"
    method: GET
    return_content: true
    status_code: 200
  register: wildfly_app_health
  changed_when: false
  when: not ansible_check_mode
  tags:
    - verify

- name: Potwierdź działanie endpointu aplikacji
  ansible.builtin.assert:
    that:
      - wildfly_app_health.status == 200
    fail_msg: "Endpoint aplikacji hello-wildfly nie odpowiada poprawnie."
    success_msg: "Endpoint aplikacji hello-wildfly odpowiada poprawnie HTTP 200."
  when: not ansible_check_mode
  tags:
    - verify

- name: Sprawdź plik SHA-256 wdrożonego WAR
  ansible.builtin.stat:
    path: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.sha256"
  register: wildfly_checksum_file
  changed_when: false

- name: Potwierdź obecność pliku SHA-256
  ansible.builtin.assert:
    that:
      - wildfly_checksum_file.stat.exists
      - wildfly_checksum_file.stat.isreg
    fail_msg: >-
      Brak pliku checksumy
      {{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.sha256
      na hoście {{ inventory_hostname }}.
    success_msg: >-
      Plik checksumy WAR jest dostępny.

- name: Oblicz SHA-256 aktualnie wdrożonego WAR
  ansible.builtin.stat:
    path: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war"
    checksum_algorithm: sha256
    get_checksum: true
  register: wildfly_verified_war
  changed_when: false

- name: Odczytaj zapisany SHA-256 wdrożonego WAR
  ansible.builtin.command:
    argv:
      - awk
      - '{print $1}'
      - "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war.sha256"
  register: wildfly_saved_checksum
  changed_when: false

- name: Potwierdź integralność wdrożonego WAR
  ansible.builtin.assert:
    that:
      - wildfly_verified_war.stat.exists
      - wildfly_saved_checksum.stdout == wildfly_verified_war.stat.checksum
    fail_msg: >-
      Integralność WAR {{ wildfly_app_name }} na hoście
      {{ inventory_hostname }} nie została potwierdzona.
    success_msg: >-
      Integralność WAR {{ wildfly_app_name }} potwierdzona.
      SHA-256={{ wildfly_verified_war.stat.checksum }}

- name: Odczytaj metadane wdrożonego buildu
  ansible.builtin.command:
    argv:
      - cat
      - "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.build-info.properties"
  register: wildfly_deployed_build_info
  changed_when: false

- name: Wyświetl metadane wdrożonego buildu
  ansible.builtin.debug:
    msg: "{{ wildfly_deployed_build_info.stdout_lines }}"
