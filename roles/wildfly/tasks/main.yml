---
- name: Utwórz grupę WildFly
  ansible.builtin.group:
    name: "{{ wildfly_group }}"
    state: present

- name: Utwórz użytkownika WildFly
  ansible.builtin.user:
    name: "{{ wildfly_user }}"
    group: "{{ wildfly_group }}"
    shell: /usr/sbin/nologin
    home: "{{ wildfly_home }}"
    create_home: false
    system: true
    state: present

- name: Pobierz archiwum WildFly
  ansible.builtin.get_url:
    url: "{{ wildfly_download_url }}"
    dest: "{{ wildfly_archive_path }}"
    checksum: "sha256:{{ wildfly_sha256 }}"
    mode: '0644'

- name: Rozpakuj WildFly
  ansible.builtin.unarchive:
    src: "{{ wildfly_archive_path }}"
    dest: "{{ wildfly_install_parent }}"
    remote_src: true
    creates: "{{ wildfly_version_dir }}/bin/standalone.sh"
  when: not ansible_check_mode

- name: Ustaw właściciela instalacji WildFly
  ansible.builtin.file:
    path: "{{ wildfly_version_dir }}"
    owner: "{{ wildfly_user }}"
    group: "{{ wildfly_group }}"
    recurse: true
  when: not ansible_check_mode

- name: Utwórz dowiązanie do aktualnej wersji WildFly
  ansible.builtin.file:
    src: "{{ wildfly_version_dir }}"
    dest: "{{ wildfly_home }}"
    state: link
    owner: "{{ wildfly_user }}"
    group: "{{ wildfly_group }}"
  when: not ansible_check_mode

- name: Utwórz jednostkę systemd dla WildFly
  ansible.builtin.template:
    src: wildfly.service.j2
    dest: "/etc/systemd/system/{{ wildfly_service }}.service"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart WildFly
  when: not ansible_check_mode

- name: Włącz i uruchom WildFly
  ansible.builtin.systemd:
    name: "{{ wildfly_service }}"
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Wdróż aplikację hello-wildfly
  ansible.builtin.copy:
    src: "{{ wildfly_war_source }}"
    dest: "{{ wildfly_deployments_dir }}/{{ wildfly_app_name }}.war"
    owner: "{{ wildfly_user }}"
    group: "{{ wildfly_group }}"
    mode: '0644'
  tags:
    - deploy

- name: Zainstaluj sterownik JDBC PostgreSQL
  ansible.builtin.package:
    name: "{{ wildfly_postgresql_jdbc_package }}"
    state: present

- name: Utwórz katalog modułu PostgreSQL
  ansible.builtin.file:
    path: "{{ wildfly_postgresql_module_dir }}"
    state: directory
    owner: "{{ wildfly_user }}"
    group: "{{ wildfly_group }}"
    mode: '0755'
  when: not ansible_check_mode

- name: Udostępnij sterownik PostgreSQL jako moduł WildFly
  ansible.builtin.file:
    src: "{{ wildfly_postgresql_jdbc_jar }}"
    dest: "{{ wildfly_postgresql_module_dir }}/postgresql.jar"
    state: link
    owner: "{{ wildfly_user }}"
    group: "{{ wildfly_group }}"
  when: not ansible_check_mode

- name: Skonfiguruj moduł PostgreSQL
  ansible.builtin.template:
    src: postgresql-module.xml.j2
    dest: "{{ wildfly_postgresql_module_dir }}/module.xml"
    owner: "{{ wildfly_user }}"
    group: "{{ wildfly_group }}"
    mode: '0644'
  when: not ansible_check_mode
  notify: Restart WildFly

- name: Sprawdź rejestrację drivera PostgreSQL w WildFly
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ wildfly_user }}"
      - --
      - "{{ wildfly_home }}/bin/jboss-cli.sh"
      - --connect
      - "--command=/subsystem=datasources/jdbc-driver={{ wildfly_postgresql_driver_name }}:read-resource"
  register: wildfly_postgresql_driver_check
  changed_when: false
  failed_when: wildfly_postgresql_driver_check.rc not in [0, 1]
  tags:
    - verify

- name: Zarejestruj driver PostgreSQL w WildFly
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ wildfly_user }}"
      - --
      - "{{ wildfly_home }}/bin/jboss-cli.sh"
      - --connect
      - "--command=/subsystem=datasources/jdbc-driver={{ wildfly_postgresql_driver_name }}:add(driver-name={{ wildfly_postgresql_driver_name }},driver-module-name={{ wildfly_postgresql_driver_module }},driver-class-name={{ wildfly_postgresql_driver_class }},driver-xa-datasource-class-name={{ wildfly_postgresql_driver_xa_class }},jdbc-compliant=true)"
  when:
    - not ansible_check_mode
    - wildfly_postgresql_driver_check.rc == 1
  register: wildfly_postgresql_driver_add
  changed_when: true

- name: Sprawdź datasource PostgreSQL w WildFly
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ wildfly_user }}"
      - --
      - "{{ wildfly_home }}/bin/jboss-cli.sh"
      - --connect
      - "--command=/subsystem=datasources/data-source={{ wildfly_datasource_name }}:read-resource"
  register: wildfly_datasource_check
  changed_when: false
  failed_when: wildfly_datasource_check.rc not in [0, 1]
  tags:
    - datasource

- name: Utwórz datasource PostgreSQL w WildFly
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ wildfly_user }}"
      - --
      - "{{ wildfly_home }}/bin/jboss-cli.sh"
      - --connect
      - >-
        --command=data-source add
        --name={{ wildfly_datasource_name }}
        --jndi-name={{ wildfly_datasource_jndi_name }}
        --driver-name={{ wildfly_postgresql_driver_name }}
        --connection-url=jdbc:postgresql://{{ wildfly_datasource_host }}:{{ wildfly_datasource_port }}/{{ postgresql_db_name }}
        --user-name={{ postgresql_db_user }}
        --password="{{ postgresql_db_password }}"
        --jta={{ wildfly_datasource_jta | lower }}
        --min-pool-size={{ wildfly_datasource_min_pool_size }}
        --max-pool-size={{ wildfly_datasource_max_pool_size }}
  when:
    - not ansible_check_mode
    - wildfly_datasource_check.rc == 1
  register: wildfly_datasource_add
  changed_when: true
  no_log: true
  tags:
    - datasource

- name: Sprawdź połączenie istniejącego datasource
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ wildfly_user }}"
      - --
      - "{{ wildfly_home }}/bin/jboss-cli.sh"
      - --connect
      - "--command=/subsystem=datasources/data-source={{ wildfly_datasource_name }}:test-connection-in-pool"
  register: wildfly_datasource_connection_check
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - wildfly_datasource_check.rc == 0
  tags:
    - datasource

- name: Zaktualizuj hasło datasource PostgreSQL
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ wildfly_user }}"
      - --
      - "{{ wildfly_home }}/bin/jboss-cli.sh"
      - --connect
      - >-
        --command=/subsystem=datasources/data-source={{ wildfly_datasource_name }}:
        write-attribute(name=password,value="{{ postgresql_db_password }}")
  when:
    - not ansible_check_mode
    - wildfly_datasource_check.rc == 0
    - wildfly_datasource_connection_check.rc != 0
  changed_when: true
  no_log: true
  tags:
    - datasource

- name: Opróżnij pulę połączeń datasource po zmianie hasła
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ wildfly_user }}"
      - --
      - "{{ wildfly_home }}/bin/jboss-cli.sh"
      - --connect
      - "--command=/subsystem=datasources/data-source={{ wildfly_datasource_name }}:flush-all-connection-in-pool"
  when:
    - not ansible_check_mode
    - wildfly_datasource_check.rc == 0
    - wildfly_datasource_connection_check.rc != 0
  changed_when: true
  tags:
    - datasource

- name: Testuj połączenie datasource PostgreSQL
  ansible.builtin.command:
    argv:
      - /opt/wildfly/bin/jboss-cli.sh
      - --connect
      - --command=/subsystem=datasources/data-source={{ wildfly_datasource_name }}:test-connection-in-pool
  become: true
  become_user: wildfly
  register: datasource_test
  changed_when: false
  tags:
    - datasource
    - verify

- name: Zweryfikuj działanie datasource PostgreSQL
  ansible.builtin.assert:
    that:
      - '"\"outcome\" => \"success\"" in datasource_test.stdout'
      - '"\"result\" => [true]" in datasource_test.stdout'
    fail_msg: "Datasource {{ wildfly_datasource_name }} nie może połączyć się z PostgreSQL"
    success_msg: "Datasource {{ wildfly_datasource_name }} działa poprawnie"
  tags:
    - datasource
    - verify
