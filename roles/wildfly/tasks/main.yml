---
- name: Walidacja podstawowa WildFly
  ansible.builtin.import_tasks: validate.yml
  tags:
    - always

- name: Instalacja WildFly
  ansible.builtin.import_tasks: install.yml
  tags:
    - install

- name: Konfiguracja usługi WildFly
  ansible.builtin.import_tasks: service.yml
  tags:
    - service

- name: Walidacja datasource PostgreSQL
  ansible.builtin.import_tasks: validate_datasource.yml
  tags:
    - jdbc
    - datasource
    - deploy
    - verify

- name: Zadania JDBC PostgreSQL
  ansible.builtin.import_tasks: jdbc.yml
  tags:
    - jdbc

- name: Zadania datasource PostgreSQL
  ansible.builtin.import_tasks: datasource.yml
  tags:
    - datasource

- name: Pre-flight datasource przed deploymentem
  ansible.builtin.import_tasks: preflight.yml
  tags:
    - deploy

- name: Zadania deploymentu aplikacji
  ansible.builtin.import_tasks: deploy.yml
  tags:
    - deploy

- name: Weryfikacja datasource PostgreSQL
  ansible.builtin.import_tasks: verify.yml
  tags:
    - verify
