---
- name: Sprawdź wymagane zmienne podstawowe roli WildFly
  ansible.builtin.assert:
    that:
      - wildfly_home is defined
      - wildfly_home | length > 0
      - wildfly_user is defined
      - wildfly_user | length > 0
      - wildfly_group is defined
      - wildfly_group | length > 0
      - wildfly_service is defined
      - wildfly_service | length > 0
      - wildfly_java_home is defined
      - wildfly_java_home | length > 0
    fail_msg: "Brakuje wymaganej zmiennej podstawowej roli WildFly."
    success_msg: "Podstawowe zmienne roli WildFly są poprawnie zdefiniowane."
