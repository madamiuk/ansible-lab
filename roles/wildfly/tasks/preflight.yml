---
- name: Sprawdź artefakt WAR na kontrolerze
  ansible.builtin.stat:
    path: "{{ wildfly_war_source }}"
    checksum_algorithm: sha256
    get_checksum: true
  register: wildfly_war_artifact
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

- name: Potwierdź poprawność artefaktu WAR
  ansible.builtin.assert:
    that:
      - wildfly_war_artifact.stat.exists
      - wildfly_war_artifact.stat.isreg
      - wildfly_war_artifact.stat.size | int > 0
    fail_msg: >-
      Artefakt WAR {{ wildfly_war_source }} nie istnieje,
      nie jest plikiem lub ma rozmiar 0 bajtów.
    success_msg: >-
      Artefakt WAR {{ wildfly_war_source }} jest gotowy do deploymentu.
  run_once: true

- name: Wyświetl identyfikator artefaktu WAR
  ansible.builtin.debug:
    msg: >-
      Artefakt {{ wildfly_war_source }}
      size={{ wildfly_war_artifact.stat.size }} B,
      sha256={{ wildfly_war_artifact.stat.checksum }}
  run_once: true

- name: Sprawdź strukturę archiwum WAR
  ansible.builtin.command:
    argv:
      - jar
      - tf
      - "{{ wildfly_war_source }}"
  register: wildfly_war_archive_check
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  failed_when: false

- name: Potwierdź wymaganą zawartość WAR
  ansible.builtin.assert:
    that:
      - item in wildfly_war_archive_check.stdout
    fail_msg: >-
      Artefakt WAR {{ wildfly_war_source }}
      nie zawiera wymaganego elementu {{ item }}.
    success_msg: >-
      Artefakt WAR {{ wildfly_war_source }}
      zawiera wymagany element {{ item }}.
  loop: "{{ wildfly_required_war_entries }}"
  run_once: true

- name: Potwierdź poprawność archiwum WAR
  ansible.builtin.assert:
    that:
      - wildfly_war_archive_check.rc == 0
    fail_msg: >-
      Artefakt WAR {{ wildfly_war_source }} nie jest poprawnym archiwum WAR/ZIP.
    success_msg: >-
      Artefakt WAR {{ wildfly_war_source }} jest poprawnym archiwum WAR.
  run_once: true

- name: Odczytaj metadane buildu z WAR
  ansible.builtin.command:
    argv:
      - unzip
      - -p
      - "{{ wildfly_war_source }}"
      - WEB-INF/classes/build-info.properties
  register: wildfly_build_info
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  failed_when: false
  when: wildfly_build_info_required | bool

- name: Potwierdź obecność metadanych buildu
  ansible.builtin.assert:
    that:
      - wildfly_build_info.rc == 0
      - '"git.commit=" in wildfly_build_info.stdout'
      - '"git.ref=" in wildfly_build_info.stdout'
      - '"github.run.id=" in wildfly_build_info.stdout'
      - '"github.run.number=" in wildfly_build_info.stdout'
    fail_msg: >-
      Artefakt WAR {{ wildfly_war_source }} nie zawiera poprawnych
      metadanych buildu w WEB-INF/classes/build-info.properties.
    success_msg: >-
      Artefakt WAR zawiera poprawne metadane buildu.
  run_once: true
  when: wildfly_build_info_required | bool

- name: Wyświetl metadane buildu
  ansible.builtin.debug:
    msg: "{{ wildfly_build_info.stdout_lines }}"
  run_once: true
  when: wildfly_build_info_required | bool

- name: Sprawdź połączenie datasource przed deploymentem
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ wildfly_user }}"
      - --
      - "{{ wildfly_home }}/bin/jboss-cli.sh"
      - --connect
      - "--command=/subsystem=datasources/data-source={{ wildfly_datasource_name }}:test-connection-in-pool"
  register: wildfly_preflight_datasource
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Potwierdź gotowość datasource przed deploymentem
  ansible.builtin.assert:
    that:
      - wildfly_preflight_datasource.rc == 0
      - '"\"outcome\" => \"success\"" in wildfly_preflight_datasource.stdout'
      - '"\"result\" => [true]" in wildfly_preflight_datasource.stdout'
    fail_msg: >-
      Datasource {{ wildfly_datasource_name }} nie jest gotowy do deploymentu
      aplikacji na hoście {{ inventory_hostname }}.
    success_msg: >-
      Datasource {{ wildfly_datasource_name }} jest gotowy do deploymentu.
  when: not ansible_check_mode
