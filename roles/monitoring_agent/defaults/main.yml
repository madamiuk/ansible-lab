---
monitoring_agent_epel_repo: ol9_developer_EPEL

monitoring_agent_packages:
  - nrpe
  - nrpe-selinux
  - nagios-plugins-disk
  - nagios-plugins-load
  - nagios-plugins-procs
  - nagios-plugins-swap
  - nagios-plugins-users

monitoring_agent_allowed_hosts:
  - 127.0.0.1
  - 10.10.1.176

monitoring_agent_nrpe_port: 5666

monitoring_agent_thresholds:
  users:
    warning: 5
    critical: 10

  load:
    warning: "5,4,3"
    critical: "10,8,6"

  root_disk:
    warning_free: "20%"
    critical_free: "10%"

  swap:
    warning_free: "20%"
    critical_free: "10%"

  zombie_procs:
    warning: 5
    critical: 10

  total_procs:
    warning: 250
    critical: 400

  memory:
    warning_free: 20
    critical_free: 10

  postgresql_process:
    critical: "1:"

monitoring_agent_threshold_overrides: {}

monitoring_agent_effective_thresholds: >-
  {{
    monitoring_agent_thresholds
    | combine(monitoring_agent_threshold_overrides, recursive=True)
  }}
