---
nagios_server_epel_repo: ol9_developer_EPEL

nagios_server_packages:
  - nagios
  - httpd
  - httpd-tools
  - php
  - php-cli
  - php-gd
  - python3-passlib
  - nagios-plugins-disk
  - nagios-plugins-http
  - nagios-plugins-load
  - nagios-plugins-ping
  - nagios-plugins-pgsql
  - nagios-plugins-procs
  - nagios-plugins-ssh
  - nagios-plugins-swap
  - nagios-plugins-users
  - nagios-plugins-nrpe

nagios_server_admin_user: nagiosadmin
nagios_server_admin_password: "{{ vault_nagios_admin_password }}"

nagios_server_postgresql_port: 5432
nagios_server_postgresql_database: jobtracker
nagios_server_postgresql_user: nagios_monitor
nagios_server_postgresql_password: "{{ vault_nagios_monitor_db_password }}"

nagios_server_common_services:
  - description: PING
    command: "check_ping!100.0,20%!500.0,60%"

  - description: SSH
    command: check_ssh

  - description: Load
    command: "check_nrpe!check_load"

  - description: Root Disk
    command: "check_nrpe!check_root_disk"

  - description: Users
    command: "check_nrpe!check_users"

  - description: Processes
    command: "check_nrpe!check_total_procs"

  - description: Swap
    command: "check_nrpe!check_swap"

  - description: Memory
    command: "check_nrpe!check_memory"

nagios_server_hosts:
  - name: oci-ansible01
    alias: OCI Ansible Application Server
    private_ip: "{{ hostvars['oci-ansible01'].private_ip }}"
    extra_services:
      - description: WildFly HTTP
        command: "check_http!-p 8080 -u /"

  - name: oci-ansible03
    alias: OCI PostgreSQL Database Server
    private_ip: "{{ hostvars['oci-ansible03'].private_ip }}"
    extra_services:
      - description: PostgreSQL Process
        command: "check_nrpe!check_postgresql_process"

      - description: PostgreSQL JobTracker
        command: check_pgsql_jobtracker

      - description: PostgreSQL Connections
        command: check_pgsql_connections

      - description: PostgreSQL Database Size
        command: check_pgsql_database_size
