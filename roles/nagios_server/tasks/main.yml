---
- name: Check whether Oracle EPEL repository is enabled
  ansible.builtin.command:
    cmd: dnf repolist --enabled
  register: nagios_server_enabled_repos
  changed_when: false

- name: Enable Oracle Linux EPEL repository
  ansible.builtin.command:
    cmd: "dnf config-manager --set-enable {{ nagios_server_epel_repo }}"
  when: nagios_server_epel_repo not in nagios_server_enabled_repos.stdout

- name: Install Nagios server packages
  ansible.builtin.dnf:
    name: "{{ nagios_server_packages }}"
    state: present
    update_cache: true

- name: Install Apache password utility
  ansible.builtin.dnf:
    name: httpd-tools
    state: present

- name: Configure Nagios web administrator
  community.general.htpasswd:
    path: /etc/nagios/passwd
    name: "{{ nagios_server_admin_user }}"
    password: "{{ nagios_server_admin_password }}"
    owner: root
    group: apache
    mode: "0640"
  no_log: true

- name: Configure Nagios localhost HTTP check
  ansible.builtin.lineinfile:
    path: /etc/nagios/objects/localhost.cfg
    regexp: '^\s*check_command\s+check_http\s*$'
    line: '    check_command           check_http!-u /nagios/ -e 401'
  notify: Restart nagios

- name: Ensure Nagios custom configuration directory exists
  ansible.builtin.file:
    path: /etc/nagios/conf.d
    state: directory
    owner: root
    group: nagios
    mode: "0750"

- name: Include custom Nagios configuration directory
  ansible.builtin.lineinfile:
    path: /etc/nagios/nagios.cfg
    regexp: '^cfg_dir=/etc/nagios/conf\.d$'
    line: 'cfg_dir=/etc/nagios/conf.d'
  notify: Restart nagios

- name: Validate monitored OCI host metadata
  ansible.builtin.assert:
    that:
      - hostvars[monitored_host].private_ip is defined
      - hostvars[monitored_host].private_ip | length > 0
    fail_msg: >-
      Host {{ monitored_host }} does not have private_ip
      generated from Terraform.
  loop: "{{ groups['monitored_hosts'] | default([]) }}"
  loop_control:
    loop_var: monitored_host
    label: "{{ monitored_host }}"

- name: Configure monitored OCI hosts in Nagios
  ansible.builtin.template:
    src: oci-host.cfg.j2
    dest: "/etc/nagios/conf.d/{{ monitored_host }}.cfg"
    owner: root
    group: nagios
    mode: "0640"
  loop: "{{ groups['monitored_hosts'] | default([]) }}"
  loop_control:
    loop_var: monitored_host
    label: "{{ monitored_host }}"
  notify: Restart nagios

- name: Configure Nagios NRPE command
  ansible.builtin.template:
    src: check_nrpe.cfg.j2
    dest: /etc/nagios/conf.d/check_nrpe.cfg
    owner: root
    group: nagios
    mode: "0640"
  notify: Restart nagios

- name: Configure PostgreSQL check credentials
  ansible.builtin.template:
    src: check_pgsql.ini.j2
    dest: /etc/nagios/check_pgsql.ini
    owner: root
    group: nagios
    mode: "0640"
  no_log: true
  notify: Restart nagios

- name: Configure Nagios PostgreSQL command
  ansible.builtin.template:
    src: check_pgsql.cfg.j2
    dest: /etc/nagios/conf.d/check_pgsql.cfg
    owner: root
    group: nagios
    mode: "0640"
  notify: Restart nagios

- name: Validate Nagios configuration
  ansible.builtin.command:
    cmd: nagios -v /etc/nagios/nagios.cfg
  changed_when: false

- name: Ensure Apache is enabled and running
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true

- name: Ensure Nagios is enabled and running
  ansible.builtin.service:
    name: nagios
    state: started
    enabled: true
