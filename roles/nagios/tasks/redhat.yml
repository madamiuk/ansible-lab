---
- name: Zainstaluj konfigurację repozytorium Oracle EPEL
  ansible.builtin.dnf:
    name: oracle-epel-release-el9
    state: present

- name: Sprawdź aktywne repozytoria
  ansible.builtin.command:
    argv:
      - dnf
      - repolist
      - --enabled
  register: nagios_enabled_repos
  changed_when: false

- name: Włącz repozytorium Oracle EPEL
  ansible.builtin.command:
    argv:
      - dnf
      - config-manager
      - --set-enabled
      - ol9_developer_EPEL
  when: "'ol9_developer_EPEL' not in nagios_enabled_repos.stdout"

- name: Zainstaluj Nagios i podstawowe pluginy
  ansible.builtin.dnf:
    name: "{{ nagios_packages }}"
    state: present

- name: Sprawdź konfigurację Nagios
  ansible.builtin.command:
    argv:
      - nagios
      - -v
      - /etc/nagios/nagios.cfg
  changed_when: false

- name: Uruchom i włącz Nagios
  ansible.builtin.service:
    name: nagios
    state: started
    enabled: true

- name: Sprawdź hasło administratora Nagios
  ansible.builtin.command:
    argv:
      - /bin/htpasswd
      - -vi
      - /etc/nagios/passwd
      - "{{ nagios_admin_user }}"
    stdin: "{{ nagios_admin_password }}"
  register: nagios_password_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Ustaw hasło administratora Nagios
  ansible.builtin.command:
    argv:
      - /bin/htpasswd
      - -iB
      - /etc/nagios/passwd
      - "{{ nagios_admin_user }}"
    stdin: "{{ nagios_admin_password }}"
  when: nagios_password_check.rc != 0
  no_log: true
  notify: Restart httpd

- name: Dodaj plik hosts.cfg do konfiguracji Nagios
  ansible.builtin.lineinfile:
    path: /etc/nagios/nagios.cfg
    line: "cfg_file=/etc/nagios/objects/hosts.cfg"
    state: present
  notify: Restart nagios

- name: Wygeneruj konfigurację monitorowanych hostów
  ansible.builtin.template:
    src: hosts.cfg.j2
    dest: /etc/nagios/objects/hosts.cfg
    owner: root
    group: nagios
    mode: "0644"
  notify: Restart nagios

- name: Dodaj plik services.cfg do konfiguracji Nagios
  ansible.builtin.lineinfile:
    path: /etc/nagios/nagios.cfg
    line: "cfg_file=/etc/nagios/objects/services.cfg"
    state: present
  notify: Restart nagios

- name: Wygeneruj konfigurację monitorowanych usług
  ansible.builtin.template:
    src: services.cfg.j2
    dest: /etc/nagios/objects/services.cfg
    owner: root
    group: nagios
    mode: "0644"
  notify: Restart nagios

- name: Dodaj plik commands_nrpe.cfg do konfiguracji Nagios
  ansible.builtin.lineinfile:
    path: /etc/nagios/nagios.cfg
    line: "cfg_file=/etc/nagios/objects/commands_nrpe.cfg"
    state: present
  notify: Restart nagios

- name: Wygeneruj komendę check_nrpe
  ansible.builtin.template:
    src: commands_nrpe.cfg.j2
    dest: /etc/nagios/objects/commands_nrpe.cfg
    owner: root
    group: nagios
    mode: "0644"
  notify: Restart nagios

- name: Sprawdź konfigurację Nagios po zmianach
  ansible.builtin.command:
    argv:
      - nagios
      - -v
      - /etc/nagios/nagios.cfg
  changed_when: false

- name: Wykonaj oczekujące handlery
  ansible.builtin.meta: flush_handlers
