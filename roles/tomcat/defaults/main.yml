---
tomcat_package: tomcat11
tomcat_service: tomcat11

tomcat_webapps_dir: /var/lib/tomcat11/webapps
tomcat_app_name: hello-tomcat
tomcat_war_source: "{{ playbook_dir }}/applications/hello-tomcat/target/hello-tomcat.war"

tomcat_jdbc_package: libpostgresql-jdbc-java
tomcat_jdbc_source: /usr/share/java/postgresql.jar
tomcat_jdbc_dest: /usr/share/tomcat11/lib/postgresql.jar
