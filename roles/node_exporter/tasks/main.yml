---
- name: Ustal architekturę Node Exporter
  ansible.builtin.set_fact:
    node_exporter_arch: >-
      {{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64']
         else 'amd64' }}

- name: Utwórz grupę node_exporter
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true

- name: Utwórz użytkownika node_exporter
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Zainstaluj narzędzie tar wymagane do rozpakowania Node Exporter
  ansible.builtin.package:
    name: tar
    state: present

- name: Pobierz Node Exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    mode: "0644"

- name: Rozpakuj Node Exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"

- name: Zainstaluj binarkę Node Exporter
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart node_exporter

- name: Zainstaluj unit systemd Node Exporter
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart node_exporter

- name: Uruchom i włącz Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Sprawdź czy firewalld działa
  ansible.builtin.command:
    cmd: firewall-cmd --state
  register: node_exporter_firewalld
  changed_when: false
  failed_when: false

- name: Sprawdź regułę firewalld dla Node Exporter
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--query-rich-rule=rule family=ipv4 source address={{ node_exporter_prometheus_server }} port port={{ node_exporter_port }} protocol=tcp accept"
  register: node_exporter_firewall_rule
  changed_when: false
  failed_when: false
  when: node_exporter_firewalld.rc == 0

- name: Zezwól Prometheus na dostęp do Node Exporter
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--add-rich-rule=rule family=ipv4 source address={{ node_exporter_prometheus_server }} port port={{ node_exporter_port }} protocol=tcp accept"
  when:
    - node_exporter_firewalld.rc == 0
    - node_exporter_firewall_rule.rc != 0
  notify: Reload firewalld
