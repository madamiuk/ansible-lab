---
- name: Ustal architekturę Prometheus
  ansible.builtin.set_fact:
    prometheus_arch: >-
      {{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64']
         else 'amd64' }}

- name: Utwórz grupę prometheus
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    system: true

- name: Utwórz użytkownika prometheus
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Zainstaluj tar
  ansible.builtin.package:
    name: tar
    state: present

- name: Utwórz katalog konfiguracji Prometheus
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    owner: root
    group: "{{ prometheus_group }}"
    mode: "0755"

- name: Utwórz katalog danych Prometheus
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"

- name: Pobierz Prometheus
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: "0644"

- name: Rozpakuj Prometheus
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}/prometheus"

- name: Zainstaluj binarkę prometheus
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}/prometheus"
    dest: /usr/local/bin/prometheus
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart prometheus

- name: Zainstaluj promtool
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}/promtool"
    dest: /usr/local/bin/promtool
    owner: root
    group: root
    mode: "0755"
    remote_src: true

- name: Wygeneruj konfigurację Prometheus
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: "{{ prometheus_group }}"
    mode: "0644"
  notify: Restart prometheus

- name: Wdróż reguły alertów Prometheus
  ansible.builtin.template:
    src: alerts.yml.j2
    dest: /etc/prometheus/alerts.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Restart prometheus

- name: Sprawdź konfigurację Prometheus
  ansible.builtin.command:
    cmd: "/usr/local/bin/promtool check config {{ prometheus_config_dir }}/prometheus.yml"
  changed_when: false

- name: Zainstaluj unit systemd Prometheus
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart prometheus

- name: Uruchom i włącz Prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
    daemon_reload: true
