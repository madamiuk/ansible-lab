---
- name: Zainstaluj PostgreSQL
  ansible.builtin.apt:
    name: "{{ postgresql_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Zainstaluj bibliotekę Python dla PostgreSQL
  ansible.builtin.apt:
    name: "{{ postgresql_python_package }}"
    state: present

- name: Zainstaluj ACL
  ansible.builtin.apt:
    name: "{{ postgresql_acl_package }}"
    state: present

- name: Uruchom i włącz PostgreSQL
  ansible.builtin.service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true

- name: Utwórz użytkownika PostgreSQL
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgresql_db_user }}"
    password: "{{ postgresql_db_password }}"
    state: present
    role_attr_flags: LOGIN
  no_log: true

- name: Utwórz bazę PostgreSQL
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgresql_db_name }}"
    owner: "{{ postgresql_db_user }}"
    state: present

- name: Utwórz tabelę aplikacyjną
  community.postgresql.postgresql_table:
    login_host: 127.0.0.1
    login_user: "{{ postgresql_db_user }}"
    login_password: "{{ postgresql_db_password }}"
    login_db: "{{ postgresql_db_name }}"
    name: "{{ postgresql_table }}"
    columns:
      - id bigserial primary key
      - hostname text
      - created_at timestamptz
    state: present
  no_log: true

- name: Skonfiguruj adresy nasłuchiwania PostgreSQL
  ansible.builtin.lineinfile:
    path: "{{ postgresql_config_file }}"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ postgresql_listen_addresses | join(',') }}'"
  notify: Restart PostgreSQL

- name: Zbuduj podstawowe reguły pg_hba
  ansible.builtin.set_fact:
    postgresql_hba_rules:
      - contype: local
        databases: all
        users: postgres
        method: peer

      - contype: local
        databases: all
        users: all
        method: peer

      - contype: host
        databases: all
        users: all
        address: 127.0.0.1/32
        method: scram-sha-256

      - contype: host
        databases: all
        users: all
        address: ::1/128
        method: scram-sha-256

      - contype: local
        databases: replication
        users: all
        method: peer

      - contype: host
        databases: replication
        users: all
        address: 127.0.0.1/32
        method: scram-sha-256

      - contype: host
        databases: replication
        users: all
        address: ::1/128
        method: scram-sha-256
  changed_when: false

- name: Dodaj klientów aplikacyjnych do reguł pg_hba
  ansible.builtin.set_fact:
    postgresql_hba_rules: >-
      {{
        postgresql_hba_rules
        +
        [
          {
            'contype': 'host',
            'databases': postgresql_db_name,
            'users': postgresql_db_user,
            'address': item ~ '/32',
            'method': 'scram-sha-256'
          }
        ]
      }}
  loop: "{{ postgresql_allowed_hosts }}"
  changed_when: false

- name: Zarządzaj konfiguracją pg_hba.conf
  block:
    - name: Zapisz komplet reguł dostępu PostgreSQL
      community.postgresql.postgresql_pg_hba:
        dest: "{{ postgresql_hba_file }}"
        rules: >-
          {{
            postgresql_prepend_hba_rules
            + postgresql_hba_rules
            + postgresql_extra_hba_rules
          }}
        sort_rules: false
        overwrite: true
        backup: true
        owner: postgres
        group: postgres
        mode: "0640"
      register: postgresql_hba_result

    - name: Sprawdź poprawność konfiguracji pg_hba.conf
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_db: postgres
        query: |
          SELECT line_number, error
          FROM pg_hba_file_rules
          WHERE error IS NOT NULL
      register: postgresql_hba_validation
      changed_when: false
      failed_when: >-
        (postgresql_hba_validation is failed)
        or
        (postgresql_hba_validation.query_result is not defined)
        or
        (postgresql_hba_validation.query_result | default([]) | length > 0)
      when: not ansible_check_mode

    - name: Zleć przeładowanie konfiguracji PostgreSQL
      ansible.builtin.debug:
        msg: "Konfiguracja pg_hba.conf została zmieniona."
      changed_when: true
      when: postgresql_hba_result.changed
      notify: Reload PostgreSQL

  rescue:
    - name: Przywróć kopię konfiguracji pg_hba.conf
      ansible.builtin.copy:
        src: "{{ postgresql_hba_result.backup_file }}"
        dest: "{{ postgresql_hba_file }}"
        remote_src: true
        owner: postgres
        group: postgres
        mode: "0640"
      when:
        - postgresql_hba_result is defined
        - postgresql_hba_result.backup_file is defined
        - not ansible_check_mode

    - name: Przerwij wdrożenie niepoprawnej konfiguracji
      ansible.builtin.fail:
        msg: "Błąd konfiguracji pg_hba.conf. Wdrożenie przerwane."
