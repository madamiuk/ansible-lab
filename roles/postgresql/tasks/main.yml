---
- name: Zainstaluj PostgreSQL
  ansible.builtin.apt:
    name: "{{ postgresql_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Zainstaluj bibliotekę Python dla PostgreSQL
  ansible.builtin.apt:
    name: "{{ postgresql_python_package }}"
    state: present

- name: Zainstaluj ACL
  ansible.builtin.apt:
    name: "{{ postgresql_acl_package }}"
    state: present

- name: Uruchom i włącz PostgreSQL
  ansible.builtin.service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true

- name: Utwórz użytkownika PostgreSQL
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgresql_db_user }}"
    password: "{{ postgresql_db_password }}"
    state: present
    role_attr_flags: LOGIN
  no_log: true

- name: Utwórz bazę PostgreSQL
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgresql_db_name }}"
    owner: "{{ postgresql_db_user }}"
    state: present

- name: Utwórz tabelę aplikacyjną
  community.postgresql.postgresql_table:
    login_host: 127.0.0.1
    login_user: "{{ postgresql_db_user }}"
    login_password: "{{ postgresql_db_password }}"
    login_db: "{{ postgresql_db_name }}"
    name: "{{ postgresql_table }}"
    columns:
      - id bigserial primary key
      - hostname text
      - created_at timestamptz
    state: present
  no_log: true

- name: Skonfiguruj adresy nasłuchiwania PostgreSQL
  ansible.builtin.lineinfile:
    path: "{{ postgresql_config_file }}"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ postgresql_listen_addresses | join(',') }}'"
  notify: Restart PostgreSQL

- name: Zbuduj podstawowe reguły pg_hba
  ansible.builtin.set_fact:
    postgresql_hba_rules:
      - contype: local
        databases: all
        users: postgres
        method: peer

      - contype: local
        databases: all
        users: all
        method: peer

      - contype: host
        databases: all
        users: all
        address: 127.0.0.1/32
        method: scram-sha-256

      - contype: host
        databases: all
        users: all
        address: ::1/128
        method: scram-sha-256

      - contype: local
        databases: replication
        users: all
        method: peer

      - contype: host
        databases: replication
        users: all
        address: 127.0.0.1/32
        method: scram-sha-256

      - contype: host
        databases: replication
        users: all
        address: ::1/128
        method: scram-sha-256
  changed_when: false

- name: Dodaj klientów aplikacyjnych do reguł pg_hba
  ansible.builtin.set_fact:
    postgresql_hba_rules: >-
      {{
        postgresql_hba_rules
        +
        [
          {
            'contype': 'host',
            'databases': postgresql_db_name,
            'users': postgresql_db_user,
            'address': item ~ '/32',
            'method': 'scram-sha-256'
          }
        ]
      }}
  loop: "{{ postgresql_allowed_hosts }}"
  changed_when: false

- name: Zarządzaj konfiguracją pg_hba.conf
  community.postgresql.postgresql_pg_hba:
    dest: "{{ postgresql_hba_file }}"
    rules: "{{ postgresql_hba_rules }}"
    overwrite: true
    backup: true
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart PostgreSQL
