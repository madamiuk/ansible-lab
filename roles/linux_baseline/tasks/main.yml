---
- name: Install basic administration packages
  ansible.builtin.dnf:
    name: "{{ linux_baseline_packages }}"
    state: present
    update_cache: true

- name: Ensure chronyd is enabled and running
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

- name: Configure SSH hardening drop-in
  ansible.builtin.template:
    src: 10-ansible-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-ansible-hardening.conf
    owner: root
    group: root
    mode: "0600"
  when: linux_baseline_manage_ssh
  notify: Restart sshd

- name: Update all installed packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  when: linux_baseline_update_system
  register: linux_baseline_update_result

- name: Reboot host after package updates
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - linux_baseline_update_system
    - linux_baseline_reboot_if_required
    - linux_baseline_update_result.changed

- name: Ensure firewalld is installed
  ansible.builtin.dnf:
    name: firewalld
    state: present
  when: linux_baseline_manage_firewalld

- name: Ensure firewalld is enabled and running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: linux_baseline_manage_firewalld

- name: Allow required services in firewalld
  ansible.posix.firewalld:
    zone: "{{ linux_baseline_firewalld_zone }}"
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ linux_baseline_firewalld_services }}"
  when: linux_baseline_manage_firewalld

- name: Disable unnecessary services in firewalld
  ansible.posix.firewalld:
    zone: "{{ linux_baseline_firewalld_zone }}"
    service: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  loop: "{{ linux_baseline_firewalld_disabled_services }}"
  when: linux_baseline_manage_firewalld

- name: Stop and disable rpcbind socket
  ansible.builtin.systemd:
    name: rpcbind.socket
    state: stopped
    enabled: false
  when: linux_baseline_disable_rpcbind

- name: Stop and disable rpcbind service
  ansible.builtin.systemd:
    name: rpcbind.service
    state: stopped
    enabled: false
  when: linux_baseline_disable_rpcbind
