---
- name: Install basic administration packages
  ansible.builtin.dnf:
    name: "{{ linux_baseline_packages }}"
    state: present
    update_cache: true

- name: Ensure chronyd is enabled and running
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

- name: Configure SSH hardening drop-in
  ansible.builtin.template:
    src: 10-ansible-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-ansible-hardening.conf
    owner: root
    group: root
    mode: "0600"
  when: linux_baseline_manage_ssh
  notify: Restart sshd

- name: Update all installed packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  when: linux_baseline_update_system
  register: linux_baseline_update_result

- name: Get running kernel
  ansible.builtin.command:
    cmd: uname -r
  register: linux_baseline_running_kernel
  changed_when: false
  when: linux_baseline_update_system

- name: Get latest installed kernel
  ansible.builtin.shell:
    cmd: "rpm -q --last kernel-uek | head -1 | awk '{print $1}' | sed 's/^kernel-uek-//'"
  register: linux_baseline_latest_kernel
  changed_when: false
  when: linux_baseline_update_system

- name: Reboot host after kernel update
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - linux_baseline_update_system
    - linux_baseline_reboot_if_required
    - linux_baseline_running_kernel.stdout != linux_baseline_latest_kernel.stdout

- name: Ensure firewalld is installed
  ansible.builtin.dnf:
    name: firewalld
    state: present
  when: linux_baseline_manage_firewalld

- name: Ensure firewalld is enabled and running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: linux_baseline_manage_firewalld

- name: Allow required services in firewalld
  ansible.posix.firewalld:
    zone: "{{ linux_baseline_firewalld_zone }}"
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ linux_baseline_firewalld_services }}"
  when: linux_baseline_manage_firewalld

- name: Disable unnecessary services in firewalld
  ansible.posix.firewalld:
    zone: "{{ linux_baseline_firewalld_zone }}"
    service: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  loop: "{{ linux_baseline_firewalld_disabled_services }}"
  when: linux_baseline_manage_firewalld

- name: Stop and disable rpcbind socket
  ansible.builtin.systemd:
    name: rpcbind.socket
    state: stopped
    enabled: false
  when: linux_baseline_disable_rpcbind

- name: Stop and disable rpcbind service
  ansible.builtin.systemd:
    name: rpcbind.service
    state: stopped
    enabled: false
  when: linux_baseline_disable_rpcbind

- name: Ensure persistent journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  when: linux_baseline_manage_journald
  notify:
    - Restart journald
    - Flush journald

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: linux_baseline_manage_journald

- name: Configure journald persistence and limits
  ansible.builtin.template:
    src: 10-ansible-journald.conf.j2
    dest: /etc/systemd/journald.conf.d/10-ansible-journald.conf
    owner: root
    group: root
    mode: "0644"
  when: linux_baseline_manage_journald
  notify:
    - Restart journald
    - Flush journald

- name: Ensure auditd is installed
  ansible.builtin.dnf:
    name: audit
    state: present
  when: linux_baseline_manage_auditd

- name: Ensure auditd is enabled and running
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
  when: linux_baseline_manage_auditd

- name: Configure audit rules
  ansible.builtin.template:
    src: 10-ansible-audit.rules.j2
    dest: /etc/audit/rules.d/10-ansible-audit.rules
    owner: root
    group: root
    mode: "0600"
  when: linux_baseline_manage_auditd
  notify: Reload audit rules

- name: Apply sysctl hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-ansible-hardening.conf
    state: present
    reload: true
  loop: "{{ linux_baseline_sysctl | dict2items }}"
  when: linux_baseline_manage_sysctl
