---
linux_baseline_packages:
  - vim
  - git
  - curl
  - wget
  - chrony

linux_baseline_manage_ssh: true

linux_baseline_ssh_settings:
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  PubkeyAuthentication: "yes"
  X11Forwarding: "no"
  MaxAuthTries: "3"

linux_baseline_update_system: true
linux_baseline_reboot_if_required: true

linux_baseline_disable_rpcbind: false

linux_baseline_manage_firewalld: true
linux_baseline_firewalld_zone: public

linux_baseline_firewalld_services:
  - ssh

linux_baseline_firewalld_disabled_services:
  - dhcpv6-client

linux_baseline_manage_journald: true
linux_baseline_journald_storage: persistent
linux_baseline_journald_compress: "yes"
linux_baseline_journald_system_max_use: 500M
linux_baseline_journald_runtime_max_use: 100M
