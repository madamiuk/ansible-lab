---
- name: Zainstaluj NRPE na Debianie
  ansible.builtin.apt:
    name:
      - nagios-nrpe-server
      - nagios-plugins
    state: present
    update_cache: true

- name: Zezwól serwerowi Nagios na połączenia NRPE
  ansible.builtin.lineinfile:
    path: /etc/nagios/nrpe.cfg
    regexp: '^allowed_hosts='
    line: "allowed_hosts=127.0.0.1,::1,{{ nrpe_monitoring_server }}"
  notify: Restart NRPE Debian

- name: Skonfiguruj lokalny check WildFly
  ansible.builtin.copy:
    dest: /etc/nagios/nrpe.d/wildfly.cfg
    owner: root
    group: root
    mode: "0644"
    content: |
      command[check_wildfly_http]=/usr/lib/nagios/plugins/check_tcp -H 127.0.0.1 -p 8080
  notify: Restart NRPE Debian

- name: Skonfiguruj systemowe checki NRPE
  ansible.builtin.copy:
    dest: /etc/nagios/nrpe.d/system.cfg
    owner: root
    group: root
    mode: "0644"
    content: |
      command[check_load]=/usr/lib/nagios/plugins/check_load -w 5,4,3 -c 10,8,6
      command[check_disk_root]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /
      command[check_procs]=/usr/lib/nagios/plugins/check_procs -w 250 -c 400
  notify: Restart NRPE Debian

- name: Zainstaluj plugin check_memory
  ansible.builtin.copy:
    src: check_memory
    dest: /usr/lib/nagios/plugins/check_memory
    owner: root
    group: root
    mode: "0755"

- name: Dodaj check pamięci do NRPE
  ansible.builtin.lineinfile:
    path: /etc/nagios/nrpe.d/system.cfg
    line: "command[check_memory]=/usr/lib/nagios/plugins/check_memory"
  notify: Restart NRPE Debian

- name: Uruchom i włącz NRPE na Debianie
  ansible.builtin.service:
    name: nagios-nrpe-server
    state: started
    enabled: true
