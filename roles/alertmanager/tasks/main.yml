---
- name: Ustal architekturę Alertmanager
  ansible.builtin.set_fact:
    alertmanager_arch: >-
      {{
        'arm64'
        if ansible_facts['architecture'] in ['aarch64', 'arm64']
        else 'amd64'
      }}

- name: Utwórz grupę Alertmanager
  ansible.builtin.group:
    name: "{{ alertmanager_group }}"
    system: true
    state: present

- name: Utwórz użytkownika Alertmanager
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Utwórz katalog konfiguracji Alertmanager
  ansible.builtin.file:
    path: "{{ alertmanager_config_dir }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: "0755"

- name: Utwórz katalog danych Alertmanager
  ansible.builtin.file:
    path: "{{ alertmanager_data_dir }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: "0755"

- name: Pobierz archiwum Alertmanager
  ansible.builtin.get_url:
    url: "{{ alertmanager_download_url }}"
    dest: "/tmp/alertmanager-{{ alertmanager_version }}.tar.gz"
    mode: "0644"

- name: Rozpakuj Alertmanager
  ansible.builtin.unarchive:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/alertmanager-{{ alertmanager_version }}.linux-{{ alertmanager_arch }}/alertmanager"

- name: Zainstaluj binarny plik Alertmanager
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-{{ alertmanager_arch }}/alertmanager"
    dest: /usr/local/bin/alertmanager
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart Alertmanager

- name: Zainstaluj amtool
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-{{ alertmanager_arch }}/amtool"
    dest: /usr/local/bin/amtool
    owner: root
    group: root
    mode: "0755"
    remote_src: true

- name: Wdróż konfigurację Alertmanager
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: "0644"
  notify: Restart Alertmanager

- name: Wdróż jednostkę systemd Alertmanager
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Alertmanager

- name: Przeładuj konfigurację systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Uruchom i włącz Alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: started
    enabled: true
