---
- name: Laboratorium clear_facts
  hosts: wildfly
  gather_facts: false

  tasks:
    - name: Pokaż fakt przed czyszczeniem
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}
          application={{ ansible_facts['lab_application'] | default('brak') }}

    - name: Wyczyść fakty hosta
      ansible.builtin.meta: clear_facts

    - name: Pokaż fakt po czyszczeniu
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}
          application={{ ansible_facts['lab_application'] | default('brak') }}
