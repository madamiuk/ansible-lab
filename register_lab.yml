---
- name: Laboratorium register set_fact when
  hosts: wildfly
  gather_facts: false

  tasks:
    - name: Sprawdź status usługi WildFly
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - wildfly
      register: wildfly_status
      changed_when: false
      failed_when: false

    - name: Oznacz task jako changed gdy WildFly nie jest active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - wildfly
      register: wildfly_changed_test
      changed_when: wildfly_changed_test.stdout != "active"
      failed_when: false

    - name: Wymuś błąd gdy WildFly nie jest active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - wildfly
      register: wildfly_failed_test
      changed_when: false
      failed_when: wildfly_failed_test.stdout != "active"

    - name: Pokaż pełny wynik register
      ansible.builtin.debug:
        var: wildfly_status

    - name: Ustaw fakt czy WildFly działa
      ansible.builtin.set_fact:
        wildfly_running: "{{ (wildfly_status.stdout | default('')) == 'active' }}"

    - name: Pokaż uproszczony stan usługi
      ansible.builtin.debug:
        msg: "WildFly działa: {{ wildfly_running }}"

    - name: Sprawdź endpoint tylko gdy WildFly działa
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/hello-wildfly/api/hello/data"
        status_code: 200
      when: wildfly_running
      changed_when: false

    - name: Sprawdź wynik po kodzie powrotu
      ansible.builtin.debug:
        msg: "systemctl zakończył się poprawnie"
      when: wildfly_status.rc == 0

    - name: Sprawdź wynik po stdout
      ansible.builtin.debug:
        msg: "WildFly ma stan ACTIVE"
      when: wildfly_status.stdout == "active"

    - name: Laboratorium block rescue always
      block:
        - name: Sprawdź nieistniejącą usługę
          ansible.builtin.command:
            argv:
              - systemctl
              - is-active
              - wildfly-does-not-exist
          register: missing_service_block
          changed_when: false
          failed_when: missing_service_block.stdout != "active"

      rescue:
        - name: Pokaż nazwę taska który zakończył się błędem
          ansible.builtin.debug:
            msg: "Błąd wystąpił w tasku: {{ ansible_failed_task.name }}"

        - name: Pokaż wynik błędnego taska
          ansible.builtin.debug:
            var: ansible_failed_result

        - name: Obsłuż błąd kontrolowanie
          ansible.builtin.debug:
            msg: "Usługa nie działa lub nie istnieje - przechodzę do rescue."

        - name: Zapisz diagnostykę błędu na kontrolerze
          ansible.builtin.lineinfile:
            path: "./register_lab_errors.log"
            create: true
            mode: "0644"
            line: >-
              host={{ inventory_hostname }}
              task={{ ansible_failed_task.name }}
              rc={{ ansible_failed_result.rc | default('brak') }}
              stdout={{ ansible_failed_result.stdout | default('') }}
              stderr={{ ansible_failed_result.stderr | default('') }}
          delegate_to: localhost

      always:
        - name: Wykonaj zadanie niezależnie od wyniku
          ansible.builtin.debug:
            msg: "Sekcja always została wykonana."
