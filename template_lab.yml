---
- name: Laboratorium Jinja2 template
  hosts: wildfly
  gather_facts: false

  vars:
    monitored_services:
      - name: wildfly
        port: 8080
        enabled: true
        critical: true
        description: "Serwer aplikacyjny WildFly"
        owner: "middleware"

      - name: sshd
        port: 22
        enabled: true
        critical: true
        owner: "system"

      - name: wildfly_management
        port: 9990
        enabled: true
        critical: false
        description: "Interfejs zarządzający WildFly"
        owner: "middleware"

      - name: test_service
        port: 12345
        enabled: false
        critical: false

  tasks:
    - name: Wygeneruj konfigurację usług
      ansible.builtin.template:
        src: templates/services.conf.j2
        dest: "/tmp/services-{{ inventory_hostname }}.conf"
        mode: "0644"
      notify: Konfiguracja usług zmieniona


    - name: Wykonaj oczekujące handlery natychmiast
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Pokaż informację o zmianie konfiguracji
      ansible.builtin.debug:
        msg: "Konfiguracja usług na {{ inventory_hostname }} została zmieniona."
      listen: Konfiguracja usług zmieniona

    - name: Zapisz dodatkowy komunikat diagnostyczny
      ansible.builtin.debug:
        msg: "Handler diagnostyczny wykonany dla {{ inventory_hostname }}."
      listen: Konfiguracja usług zmieniona
