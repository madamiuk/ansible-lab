---
- name: Laboratorium Jinja2 template
  hosts: wildfly
  gather_facts: false

  vars:
    monitored_services:
      - name: wildfly
        port: 8080
        enabled: true
        critical: true

      - name: sshd
        port: 22
        enabled: true
        critical: true

      - name: wildfly_management
        port: 9990
        enabled: true
        critical: false

      - name: test_service
        port: 12345
        enabled: false
        critical: false

  tasks:
    - name: Wygeneruj konfigurację usług
      ansible.builtin.template:
        src: templates/services.conf.j2
        dest: "/tmp/services-{{ inventory_hostname }}.conf"
        mode: "0644"
