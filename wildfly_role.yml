---
- name: Instalacja WildFly
  hosts: wildfly
  serial: 2
  any_errors_fatal: true
#  max_fail_percentage: 49
  become: true

  pre_tasks:
    - name: Sprawdź dostępność hosta
      ansible.builtin.ping:
      tags:
        - always

    - name: Sprawdź obsługiwaną rodzinę systemu
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] in ['RedHat', 'Debian']
        fail_msg: "Nieobsługiwana rodzina systemu: {{ ansible_facts['os_family'] }}"
        success_msg: "System {{ ansible_facts['os_family'] }} jest obsługiwany."
      tags:
        - always

  roles:
    - wildfly

  post_tasks:
    - name: Sprawdź endpoint aplikacji WildFly
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/hello-wildfly/api/hello/data"
        method: GET
        return_content: true
        status_code: 200
      register: wildfly_app_health
      changed_when: false
      when: not ansible_check_mode
      tags:
        - health

    - name: Potwierdź działanie aplikacji
      ansible.builtin.assert:
        that:
          - wildfly_app_health.status == 200
        fail_msg: "Aplikacja hello-wildfly nie odpowiada poprawnie."
        success_msg: "Aplikacja hello-wildfly działa poprawnie."
      when: not ansible_check_mode
      tags:
        - health

    - name: Podsumuj zakończenie wdrożenia
      ansible.builtin.debug:
        msg: "Wdrożenie WildFly zakończone dla grupy wildfly."
#      run_once: true
      when: inventory_hostname == ansible_play_hosts_all[0]  
      tags:
        - health

    - name: Sprawdź nazwę kontrolera Ansible
      ansible.builtin.command:
        argv:
          - hostname
      delegate_to: localhost
      become: false
      register: controller_hostname
      changed_when: false
      tags:
        - health

    - name: Wyświetl nazwę kontrolera
      ansible.builtin.debug:
        msg: "Task wykonano na kontrolerze: {{ controller_hostname.stdout }}"
      tags:
        - health
        
    - name: Zapisz rodzinę systemu hosta
      ansible.builtin.set_fact:
        host_os_family: "{{ ansible_facts['os_family'] }}"
      tags:
      - facts

    - name: Pokaż fakty wszystkich hostów WildFly
      ansible.builtin.debug:
        msg: >
          debian02={{ hostvars['debian02']['host_os_family'] }},
          rhel01={{ hostvars['rhel01']['host_os_family'] }}
      when: inventory_hostname == ansible_play_hosts_all[0]
      tags:
        - facts

    - name: Ustaw fakt dla rhel01 z poziomu debian02
      ansible.builtin.set_fact:
        delegated_note: "Fakt ustawiony przez debian02"
      delegate_to: rhel01
      delegate_facts: true
      when: inventory_hostname == 'debian02'
      tags:
        - facts

    - name: Odczytaj delegowany fakt rhel01
      ansible.builtin.debug:
        msg: "rhel01 delegated_note={{ hostvars['rhel01']['delegated_note'] }}"
      when: inventory_hostname == 'debian02'
      tags:
        - facts
