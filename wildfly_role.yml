---
- name: Instalacja WildFly
  hosts: wildfly
  serial: 2
  any_errors_fatal: true
#  max_fail_percentage: 49
  become: true

  pre_tasks:
    - name: Sprawdź dostępność hosta
      ansible.builtin.ping:
      tags:
        - always

    - name: Sprawdź obsługiwaną rodzinę systemu
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] in ['RedHat', 'Debian']
        fail_msg: "Nieobsługiwana rodzina systemu: {{ ansible_facts['os_family'] }}"
        success_msg: "System {{ ansible_facts['os_family'] }} jest obsługiwany."
      tags:
        - always

  roles:
    - java
    - wildfly

  post_tasks:
    - name: Podsumuj zakończenie wdrożenia
      ansible.builtin.debug:
        msg: "Wdrożenie WildFly zakończone dla grupy wildfly."
#      run_once: true
      when: inventory_hostname == ansible_play_hosts_all[0]
      tags:
        - health

    - name: Sprawdź nazwę kontrolera Ansible
      ansible.builtin.command:
        argv:
          - hostname
      delegate_to: localhost
      become: false
      register: controller_hostname
      changed_when: false
      tags:
        - health

    - name: Wyświetl nazwę kontrolera
      ansible.builtin.debug:
        msg: "Task wykonano na kontrolerze: {{ controller_hostname.stdout }}"
      tags:
        - health
