---
- name: Konfiguracja Apache z handlerem
  hosts: all
  become: true

  tasks:

    - name: Ustaw nazwę usługi na Oracle Linux
      ansible.builtin.set_fact:
        apache_service: httpd
      when: ansible_facts['distribution'] == 'OracleLinux'

    - name: Ustaw nazwę usługi na Debianie
      ansible.builtin.set_fact:
        apache_service: apache2
      when: ansible_facts['distribution'] == 'Debian'

    - name: Wygeneruj stronę WWW
      ansible.builtin.template:
        src: apache_index.j2
        dest: /var/www/html/index.html
        mode: '0644'
      notify: Restart Apache

    - name: Uruchom Apache
      ansible.builtin.service:
        name: "{{ apache_service }}"
        state: started
        enabled: true

  handlers:

    - name: Restart Apache
      ansible.builtin.service:
        name: "{{ apache_service }}"
        state: restarted
