name: Deploy WildFly

on:

  workflow_run:
      workflows:
        - Java CI
      types:
        - completed
      branches:
        - main

  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "GitHub Actions run ID containing the approved WAR artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy WAR to debian02
    environment: dev

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure Ansible environment
        run: |
          echo "/Users/ma/ansible/venv/bin" >> "$GITHUB_PATH"
          echo "ANSIBLE_CONFIG=/Users/ma/ansible/ansible.cfg" >> "$GITHUB_ENV"

      - name: Show deployment environment
        run: echo "Deploy environment=${{ vars.DEPLOY_ENV }}"

      - name: Download approved WAR artifact
        uses: actions/download-artifact@v7
        with:
          name: hello-wildfly-war
          path: applications/hello-wildfly/target
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Verify WAR artifact
        run: |
          test -f applications/hello-wildfly/target/hello-wildfly.war
          ls -lh applications/hello-wildfly/target/hello-wildfly.war

      - name: Test Ansible connection
        env:
          ANSIBLE_BECOME_PASS: ${{ secrets.ANSIBLE_BECOME_PASS }}
        run: |
          ansible debian02 \
            -i inventory.ini \
            -m ansible.builtin.ping

      - name: Deploy WildFly
        env:
          ANSIBLE_BECOME_PASS: ${{ secrets.ANSIBLE_BECOME_PASS }}
        run: |
          ansible-playbook \
            -i inventory.ini \
            wildfly_role.yml \
            --limit debian02

      - name: Verify deployed application
        run: |
          api_scheme=http
          api_host=127.0.0.1
          api_port=8080
          api_path=/hello-wildfly/api/hello/data
          ansible debian02 \
            -i inventory.ini \
            -m ansible.builtin.uri \
            -a "url=${api_scheme}://${api_host}:${api_port}${api_path} method=GET return_content=true status_code=200"
