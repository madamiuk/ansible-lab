name: Java CI

on:
  push:
    branches:
      - main
    paths:
      - "applications/hello-wildfly/**"
      - "roles/wildfly/**"
      - "group_vars/wildfly.yml"
      - "wildfly_role.yml"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "applications/hello-wildfly/**"
      - "roles/wildfly/**"
      - "group_vars/wildfly.yml"
      - "wildfly_role.yml"
      - ".github/workflows/ci.yml"

jobs:
  test:
    name: Maven tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate build metadata
        run: applications/hello-wildfly/generate-build-info.sh

      - name: Run tests and build
        run: mvn -B -f applications/hello-wildfly/pom.xml clean verify

      - name: Verify build metadata in WAR
        run: |
          jar tf applications/hello-wildfly/target/hello-wildfly.war \
            | grep -Fx 'WEB-INF/classes/build-info.properties'

          unzip -p applications/hello-wildfly/target/hello-wildfly.war \
            WEB-INF/classes/build-info.properties

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: hello-wildfly-war
          path: applications/hello-wildfly/target/hello-wildfly.war
          if-no-files-found: error
          retention-days: 7
