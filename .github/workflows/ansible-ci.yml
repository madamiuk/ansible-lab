name: Ansible CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Ansible Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.21.4

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Prepare Vault-free CI workspace
        run: |
          cp -a "$GITHUB_WORKSPACE" /tmp/ansible-ci

          for dir in /tmp/ansible-ci/group_vars /tmp/ansible-ci/host_vars; do
            [ -d "$dir" ] || continue

            find "$dir" \
              -type f \( -name "*.yml" -o -name "*.yaml" \) \
              -exec sh -c '
                for file do
                  if head -n 1 "$file" | grep -q "^\$ANSIBLE_VAULT"; then
                    echo "Replacing encrypted file for syntax validation: $file"
                    printf -- "---\nci_vault_placeholder: true\n" > "$file"
                  fi
                done
              ' sh {} +
          done

          sed -i '/^[[:space:]]*vault_password_file[[:space:]]*=/d' /tmp/ansible-ci/ansible.cfg

      - name: Ansible version
        run: ansible --version

      - name: Validate Bash scripts
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: Validate notebook inventory
        working-directory: /tmp/ansible-ci
        run: |
          ansible-inventory \
            -i inventory/notebook.ini \
            --list >/dev/null

      - name: Create CI OCI inventory
        run: |
          cat > /tmp/oci-ci.ini <<'EOF'
          [oci]
          oci-ansible01 ansible_host=127.0.0.1 ansible_user=opc
          oci-ansible02 ansible_host=127.0.0.1 ansible_user=opc
          oci-ansible03 ansible_host=127.0.0.1 ansible_user=opc

          [appservers]
          oci-ansible01

          [nagios_server]
          oci-ansible02

          [oci_database]
          oci-ansible03

          [monitored_hosts]
          oci-ansible01
          oci-ansible03
          EOF

      - name: Syntax check playbooks
        working-directory: /tmp/ansible-ci
        run: |
          set -e

          for playbook in *.yml; do
            [ -f "$playbook" ] || continue

            case "$playbook" in
              requirements.yml)
                continue
                ;;
            esac

            echo "Checking $playbook"

            ansible-playbook \
              -i inventory/notebook.ini \
              -i /tmp/oci-ci.ini \
              "$playbook" \
              --syntax-check
          done
