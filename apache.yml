---
- name: Konfiguracja Apache
  hosts: all
  become: true

  tasks:

    - name: Ustaw nazwę usługi na Oracle Linux
      ansible.builtin.set_fact:
        apache_service: httpd
      when: ansible_facts['distribution'] == 'OracleLinux'

    - name: Ustaw nazwę usługi na Debianie
      ansible.builtin.set_fact:
        apache_service: apache2
      when: ansible_facts['distribution'] == 'Debian'

    - name: Utwórz stronę WWW
      ansible.builtin.copy:
        content: |
          <html>
          <body>
          <h1>Witaj z Ansible!</h1>
          <p>Serwer: {{ inventory_hostname }}</p>
          <p>System: {{ ansible_facts['distribution'] }}</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        mode: '0644'
      notify: Restart Apache

    - name: Uruchom i włącz Apache
      ansible.builtin.service:
        name: "{{ apache_service }}"
        state: started
        enabled: true

  handlers:

    - name: Restart Apache
      ansible.builtin.service:
        name: "{{ apache_service }}"
        state: restarted
